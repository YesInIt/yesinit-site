---
# =============================================================================
#  Общие переменные
# =============================================================================

# Основной пользователь. Должен совпадать с созданным при развёртывании ВМ.
admin_user: yesinit

# Домен сайта.
site_domain: yesinit.tech

# Адрес для уведомлений Let's Encrypt (Caddy передаёт его в ACME-запросе).
admin_email: "admin@{{ site_domain }}"

# Каталог на самом сервере, куда роль ghost выкладывает docker-compose.yml
# и Caddyfile, и откуда стек запускается.
ghost_deploy_dir: "/opt/{{ site_domain }}"

# Локальный (на управляющей машине — WSL/Linux) каталог, где lookup
# 'password' один раз сгенерирует и сохранит пароли для MySQL/Ghost.
# В git не попадает, см. .gitignore.
deploy_secrets_dir: "{{ playbook_dir }}/.secrets"

# =============================================================================
#  Почта (SMTP-ящик на Timeweb для транзакционных писем Ghost)
#
#  Индивидуальные для этого деплоя — не в роли ghost, чтобы роль
#  оставалась переиспользуемой для другого сайта/провайдера почты.
#  mail_password (секрет) — в group_vars/all/vault.yml.
# =============================================================================
mail_host: smtp.timeweb.ru
mail_port: 465
# Строка, а не YAML-boolean: Jinja превращает Python True в "True" (с
# большой буквы), а Ghost/nodemailer ждёт ровно "true".
mail_secure: "true"
mail_user: "noreply@{{ site_domain }}"
mail_from: "noreply@{{ site_domain }}"
