---
# =============================================================================
#  Развёртывание блога yesinit.tech
#
#  Запуск:
#    ansible-playbook site.yml
#
#  Сухой прогон (ничего не меняет, показывает разницу):
#    ansible-playbook site.yml --check --diff
#
#  Только одна роль:
#    ansible-playbook site.yml --tags docker
#    ansible-playbook site.yml --tags ghost
#    ansible-playbook site.yml --tags backup
#
#  Прогнать бэкап прямо сейчас (обычный прогон только выкладывает
#  конфигурацию и таймер, сам бэкап ждёт расписания):
#    ansible-playbook site.yml --tags backup-now
# =============================================================================

- name: Развернуть блог
  hosts: web
  become: true

  pre_tasks:
    - name: Проверить доступность хоста
      ansible.builtin.ping:
      tags: always

    - name: Обновить кеш apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        # force_apt_get: образ ВМ (Cloud.ru) содержит битый сторонний
        # источник repo.mng.sbercloud.tech, который не резолвится даже
        # с самого сервера. python-apt (бэкенд модуля по умолчанию) на
        # любой недоступный источник падает фатально; apt-get update
        # (как в консоли) на это только предупреждает и завершается 0.
        force_apt_get: true
      tags: always

  roles:
    - role: docker
      tags: [docker]
    - role: ghost
      tags: [ghost]
    - role: backup
      tags: [backup]
